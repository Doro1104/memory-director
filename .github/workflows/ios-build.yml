name: iOS simulator build (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator only
        run: bash ios/build-simulator.sh
      - uses: actions/upload-artifact@v4
        with:
          name: memory-director-ios-simulator-unsigned
          path: work/ios-build/MemoryDirector-simulator.zip
          retention-days: 7
